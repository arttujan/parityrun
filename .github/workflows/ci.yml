# Lint (ruff, pyright: the same checks as the pre-commit hook) and the tests, on every push to main and pull request.
# publish.yml runs this first: a release tag is published only when everything here passes.
# The end-to-end tests need php (with PCOV), node 23.6+ and cargo; all three are set up, so none of them skip.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint  # a required status check in .github/rulesets/main-protection.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"  # the oldest supported: pyright checks against it
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
      - name: ruff check
        run: .venv/bin/ruff check
      - name: ruff format
        run: .venv/bin/ruff format --check
      - name: pyright
        run: .venv/bin/pyright

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})  # required checks: main-protection.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: pcov
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -rs
